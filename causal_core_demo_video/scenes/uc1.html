<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiment watcher</title>
<meta name="viewport" content="width=1920">
<script src="uc1_data.js"></script>
<style>
:root{
  --bg:#0e1115; --surface:#161a20; --surface2:#1d222a; --border:#2b323c; --grid:#262c35;
  --text:#e9ecf0; --text2:#b1b9c4; --muted:#7f8996;
  --blue:#3987e5; --orange:#d95926;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --neutral:#8a94a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
#top{position:absolute;left:0;top:0;width:1920px;height:76px;display:flex;align-items:center;padding:0 48px;
  border-bottom:1px solid var(--border);background:#11151a}
#brand{font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:14px}
#brand .dot{width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(57,135,229,.18)}
.chip-demo{font-size:15px;font-weight:600;letter-spacing:1.5px;color:var(--text2);border:1px solid var(--border);
  border-radius:6px;padding:3px 9px}
#clock{margin-left:auto;font-size:24px;color:var(--text2);font-weight:500}
#clock b{color:var(--text);font-weight:600}
#sandbox{margin-left:36px;font-size:17px;font-weight:600;letter-spacing:.6px;color:#f3c55a;border:1.5px solid #6b5520;
  background:rgba(250,178,25,.08);border-radius:999px;padding:7px 16px}
#stage{position:absolute;left:0;top:76px;width:1920px;height:850px}
.scene{position:absolute;inset:0;padding:40px 64px 0;opacity:0}
.label{font-size:17px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.h1{font-size:44px;font-weight:650;line-height:1.15;letter-spacing:-.3px}
.h2{font-size:30px;font-weight:600}
#cap{position:absolute;left:0;bottom:0;width:1920px;height:154px;display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--border);background:#11151a}
#cap div{max-width:1560px;text-align:center;font-size:33px;line-height:1.35;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 30px}
.muted{color:var(--muted)} .t2{color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:650;border-radius:999px;padding:5px 13px;
  border:1.5px solid}
.s-HEALTHY{color:#5fd35f;border-color:#1f6b1f;background:rgba(12,163,12,.10)}
.s-INVALID,.s-ALARM{color:#ff7b7b;border-color:#7a2626;background:rgba(208,59,59,.12)}
.s-WAITING{color:#f7c75a;border-color:#6b5520;background:rgba(250,178,25,.10)}
.s-PAUSED,.s-STOPPED{color:#c3cad4;border-color:#3e4652;background:rgba(138,148,163,.12)}
/* board */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:150px;align-content:start;gap:20px}
.xchip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;height:150px;position:relative}
.xchip .id{font-size:24px;font-weight:700}
.xchip .meta{font-size:17px;color:var(--text2);margin-top:4px;line-height:1.3}
.xchip .kind{position:absolute;top:20px;right:16px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.xchip .st{position:absolute;left:18px;bottom:15px}
.xchip.focus{border-color:#5b6676;box-shadow:0 0 0 2px rgba(233,236,240,.18)}
.mini{display:flex;gap:8px;margin-bottom:22px}
.mini .m{flex:1;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;
  align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:650;color:var(--text2)}
.mini .m.focus{outline:2px solid #8b96a6;color:var(--text)}
.mini .m i{font-style:normal;font-size:15px}
.mini .m.s-HEALTHY{color:#5fd35f;border-color:#1f6b1f;background:rgba(12,163,12,.10)}
.mini .m.s-INVALID,.mini .m.s-ALARM{color:#ff7b7b;border-color:#7a2626;background:rgba(208,59,59,.12)}
.mini .m.s-WAITING{color:#f7c75a;border-color:#6b5520;background:rgba(250,178,25,.10)}
.mini .m.s-PAUSED,.mini .m.s-STOPPED{color:#c3cad4;border-color:#3e4652;background:rgba(138,148,163,.12)}
.mini .m.focus{outline:3px solid #e9ecf0;outline-offset:2px}
/* action card */
.act{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.act .hd{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border);font-size:18px;
  font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text2)}
.act .hd .sb{margin-left:auto;color:#f3c55a;border:1.5px solid #6b5520;border-radius:6px;padding:3px 9px;font-size:14px}
.act .bd{padding:20px 24px}
.act .title{font-size:28px;font-weight:650;margin-bottom:8px}
.act ul{list-style:none;font-size:21px;color:var(--text2);line-height:1.55}
.act ul li::before{content:"·";margin-right:10px;color:var(--muted)}
.act .row{display:flex;align-items:center;gap:14px;padding:16px 24px;border-top:1px solid var(--border);font-size:21px;opacity:0}
.act .row .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;
  font-weight:800;flex:none}
.ic.ok{background:rgba(12,163,12,.16);color:#5fd35f;border:1.5px solid #1f6b1f}
.ic.no{background:rgba(208,59,59,.14);color:#ff7b7b;border:1.5px solid #7a2626}
.ic.wait{background:rgba(250,178,25,.12);color:#f7c75a;border:1.5px solid #6b5520}
.ic.info{background:rgba(57,135,229,.14);color:#7fb2f0;border:1.5px solid #284f80}
.truth{border:1.5px dashed #4a5563;border-radius:14px;padding:18px 24px;font-size:21px;line-height:1.5;color:var(--text2);opacity:0}
.truth b{color:var(--text)}
.truth .tl{font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.finding{font-size:22px;line-height:1.5;color:var(--text2)}
.finding b{color:var(--text)}
.big{font-size:64px;font-weight:700;letter-spacing:-1px}
svg text{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="top">
  <div id="brand"><span class="dot"></span>Experiment watcher <span class="chip-demo">DEMO</span></div>
  <div id="clock"></div>
  <div id="sandbox">SANDBOX ONLY · no production writes</div>
</div>
<div id="stage"></div>
<div id="cap"><div id="captext"></div></div>

<script>
const D = window.DATA;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const fmt = (x, d = 0) => x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (x, d) => (x >= 0 ? "+" : "−") + fmt(Math.abs(x), d);
const T = s => new Date(s.replace("+00:00", "Z"));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const clockStr = d => `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} 2026 · <b>${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")} UTC</b>`;
const ev = (exp, kind, has) => D.events.find(e => e.experiment === exp && e.kind === kind && (!has || e.detail.includes(has)));
function show(el, lt, t0, dur = .6, dy = 14) {      // fade + rise in at local time t0
  const p = ease((lt - t0) / dur); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; return p;
}

// ── statuses over replay time ─────────────────────────────────────────────
const IDS = D.backdrop.map(b => b.id).concat(["EXP-10", "EXP-11", "EXP-12"]);
const META = Object.fromEntries(D.backdrop.map(b => [b.id, { area: b.area, metric: b.metric, kind: "real", base: b.status }]));
for (const [id, m] of Object.entries(D.simulated)) META[id] = { area: "Simulated", metric: m, kind: "simulated", base: "HEALTHY" };
function statusAt(id, clock) {
  let s = META[id].base;
  for (const e of D.events) {
    if (e.experiment !== id || T(e.t) > clock) continue;
    if (e.kind === "incident") s = e.detail.includes("assignment") ? "INVALID" : e.detail.includes("guardrail") ? "ALARM" : "WAITING";
    if (e.kind === "execution") s = e.detail.includes("annotate") ? "PAUSED" : "STOPPED";
    if (e.kind === "resolution") s = "HEALTHY";
  }
  return s;
}
const ICON = { HEALTHY: "✓", INVALID: "✕", ALARM: "!", WAITING: "◷", PAUSED: "❚❚", STOPPED: "■" };
const WORD = { HEALTHY: "Healthy", INVALID: "Invalid split", ALARM: "Guardrail alarm", WAITING: "Waiting for data", PAUSED: "Paused", STOPPED: "Variant stopped" };
const pill = s => `<span class="pill s-${s}">${ICON[s]} ${WORD[s]}</span>`;

function miniBoard(focus) {
  return `<div class="mini">${IDS.map(id => `<div class="m ${id === focus ? "focus" : ""}" data-id="${id}"></div>`).join("")}</div>`;
}
function updateMini(root, clock) {
  root.querySelectorAll(".mini .m").forEach(m => {
    const s = statusAt(m.dataset.id, clock);
    m.className = `m s-${s} ${m.classList.contains("focus") ? "focus" : ""}`;
    m.innerHTML = `<i>${ICON[s]}</i>${m.dataset.id.replace("EXP-", "")}`;
  });
}

function actionCard(a, title, bullets) {
  return `<div class="act">
    <div class="hd"><span class="ic info" style="width:28px;height:28px;font-size:15px">→</span>Proposed action · ${a.proposal.target}<span class="sb">SANDBOX</span></div>
    <div class="bd"><div class="title">${title}</div><ul>${bullets.map(b => `<li>${b}</li>`).join("")}</ul></div>
    <div class="row r1"><span class="ic wait">◷</span><span>Waiting for approval · risk: ${a.proposal.risk}</span></div>
    <div class="row r2"><span class="ic ok">✓</span><span><b>Approved</b> by ${a.approval.approver} · ${T(a.approval.approved_at).toISOString().slice(11, 16)} UTC</span></div>
    <div class="row r3"><span class="ic ok">✓</span><span><b>Executed in the sandbox</b> · ${T(a.receipt.executed_at).toISOString().slice(11, 16)} UTC · receipt ${a.receipt.action_id.replace("act:", "")}</span></div>
  </div>`;
}
function updateAction(root, lt, t0, t1, t2) {
  const r1 = $(".r1", root), r2 = $(".r2", root), r3 = $(".r3", root);
  show(r1, lt, t0, .5, 6); if (lt >= t1) r1.style.display = "none"; else r1.style.display = "flex";
  show(r2, lt, t1, .5, 6); show(r3, lt, t2, .5, 6);
}

// ── SVG helpers ───────────────────────────────────────────────────────────
const NS = "http://www.w3.org/2000/svg";
function svg(w, h) { const s = document.createElementNS(NS, "svg"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`); return s; }
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

// ── scenes ────────────────────────────────────────────────────────────────
const SCENES = [];
const stage = $("#stage");
function scene(name, dur, build, update, clock, captions) {
  const root = document.createElement("div"); root.className = "scene"; stage.appendChild(root);
  build(root);
  const start = SCENES.length ? SCENES.at(-1).start + SCENES.at(-1).dur : 0;
  SCENES.push({ name, start, dur, root, update, clock, captions });
}

// 0 · open
scene("open", 11, r => {
  r.innerHTML = `<div style="position:absolute;left:160px;top:190px;width:1500px">
    <div class="label" id="o0">A demo · replay of 31 Oct – 21 Nov 2026</div>
    <div class="h1" id="o1" style="font-size:72px;margin-top:18px">An experiment watcher<br>that knows when to act</div>
    <div id="o2" style="font-size:34px;color:var(--text2);margin-top:34px;line-height:1.45">Twelve experiments. New data lands every night at 03:50 UTC.<br>Who checks every one of them, every time?</div>
    <div id="o3" style="display:flex;gap:16px;margin-top:46px;font-size:20px">
      <span class="pill s-HEALTHY">9 real experiments · anonymized</span>
      <span class="pill s-WAITING">3 simulated incidents · truth known</span>
      <span class="pill s-PAUSED">every action runs in a sandbox</span></div></div>`;
}, (r, lt) => { show($("#o0", r), lt, .3); show($("#o1", r), lt, .8); show($("#o2", r), lt, 2.6); show($("#o3", r), lt, 5); },
  () => null, [[0.5, 11, ""]]);

// 1 · board
scene("board", 21, r => {
  r.innerHTML = `<div class="label">1 · The board, re-checked at every data load</div>
    <div style="display:flex;gap:40px;margin-top:14px">
      <div class="grid" style="flex:1">${IDS.map(id => `<div class="xchip" data-id="${id}"><div class="kind">${META[id].kind}</div>
        <div class="id">${id}</div><div class="meta">${META[id].area} · ${META[id].metric}</div><div class="st"></div></div>`).join("")}</div>
      <div style="width:560px;display:flex;flex-direction:column;gap:18px">
        <div class="card" id="b1"><div class="h2" style="margin-bottom:12px">At every load it checks</div>
          <div class="finding"><b>1.</b> Is the split as planned?<br><b>2.</b> What is the effect, with its range?<br><b>3.</b> Has a guardrail moved?</div></div>
        <div class="card" id="b2"><div class="h2" style="margin-bottom:8px">Engine vs platform</div>
          <div class="finding" id="xc"></div></div>
        <div class="card" id="b3" style="border-color:#7a2626"><div class="finding" id="ex1"></div></div>
      </div></div>`;
  const ok = D.backdrop.filter(b => b.crosscheck);
  const worst = Math.max(...ok.map(b => b.crosscheck.max_abs_diff));
  $("#xc", r).innerHTML = `Re-derived from the platform's group summaries: <b>${ok.length} of ${ok.length}</b> healthy real experiments match the platform's effect and interval. Largest difference: <b>${worst.toExponential(0)}</b>.`;
  const e1 = D.backdrop[0];
  $("#ex1", r).innerHTML = `<b>${e1.id} (real):</b> ${fmt(e1.units.test)} vs ${fmt(e1.units.control)} users on a planned 50/50 split. <b>No effect reported.</b> <span class="muted">Cause not investigated.</span>`;
}, (r, lt, clock) => {
  r.querySelectorAll(".xchip").forEach((c, i) => {
    show(c, lt, .2 + i * .09, .4, 8);
    const s = statusAt(c.dataset.id, clock); $(".st", c).innerHTML = pill(s);
    c.classList.toggle("focus", c.dataset.id === "EXP-01" && lt > 14.5);
  });
  show($("#b1", r), lt, 2); show($("#b2", r), lt, 7.5); show($("#b3", r), lt, 14.5);
}, lt => { const d = Math.min(3, Math.floor(lt / 5)); return new Date(Date.UTC(2026, 9, 31 + d, 4, 0)); },
  [[0, 7, "Every night the agent re-checks every experiment: is the split as planned, what is the effect, has a guardrail moved?"],
   [7, 14.3, "It re-derives each number itself from the platform's group summaries. For the real experiments, its numbers match the platform's."],
   [14.3, 21, "One real experiment fails the split check: about 120 thousand users against 63 thousand on a planned 50/50. The agent reports no effect for it."]]);

// 2 · broken split (EXP-10)
const A10 = D.actions.find(a => a.proposal.target === "EXP-10"), A11 = D.actions.find(a => a.proposal.target === "EXP-11");
const SRM = D.srm.slice(0, 4);
scene("split", 25, r => {
  r.innerHTML = `<div class="label">2 · A broken split · EXP-10 (simulated)</div>${miniBoard("EXP-10")}
    <div style="display:flex;gap:44px">
      <div style="width:900px">
        <div class="card" style="padding:22px 26px"><div class="h2">Share of users in control</div>
          <div class="muted" style="font-size:18px;margin:4px 0 6px">Planned 50%. Shaded: where 99.9% of healthy splits would fall.</div><div id="ch10"></div></div>
        <div class="card" id="miss" style="margin-top:18px;padding:20px 26px"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:18px">
        <div class="card" id="f10" style="border-color:#7a2626"></div>
        <div id="a10">${actionCard(A10, "Freeze the decision, annotate, open a fix ticket",
          [`Annotation: “${A10.proposal.params.note}”`, `Ticket: “${A10.proposal.params.ticket}”`])}</div>
        <div class="truth" id="t10"><div class="tl">Injected truth</div>From day 3, users evaluated before their user ID is set all land in control. <b>The true effect is zero</b>, so any “result” would have been an artefact of the bug.</div>
      </div></div>`;
  const W = 848, H = 330, s = svg(W, H), x0 = 70, x1 = W - 30, y0 = 20, y1 = H - 50;
  const X = d => x0 + (d - 1) / 3 * (x1 - x0), lo = .490, hi = .512, Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
  for (const v of [.492, .496, .5, .504, .508]) { el("line", { x1: x0, x2: x1, y1: Y(v), y2: Y(v), stroke: "#262c35" }, s); el("text", { x: x0 - 12, y: Y(v) + 6, "text-anchor": "end", fill: "#7f8996", "font-size": 17 }, s, (v * 100).toFixed(1) + "%"); }
  const band = SRM.map(p => { const n = p.control + p.variant, h = 3.29 * .5 / Math.sqrt(n); return [X(p.day), Y(.5 + h), Y(.5 - h)]; });
  el("polygon", { points: band.map(b => `${b[0]},${b[1]}`).concat(band.slice().reverse().map(b => `${b[0]},${b[2]}`)).join(" "), fill: "rgba(57,135,229,.13)" }, s);
  el("line", { x1: x0, x2: x1, y1: Y(.5), y2: Y(.5), stroke: "#7f8996", "stroke-dasharray": "6 6", "stroke-width": 1.5 }, s);
  SRM.forEach(p => el("text", { x: X(p.day), y: y1 + 34, "text-anchor": "middle", fill: "#7f8996", "font-size": 17 }, s, `Day ${p.day}`));
  const pts = SRM.map(p => [X(p.day), Y(p.control / (p.control + p.variant))]);
  const path = el("path", { d: "M" + pts.map(p => p.join(",")).join(" L"), fill: "none", stroke: "#3987e5", "stroke-width": 3, "stroke-linecap": "round", id: "p10" }, s);
  pts.forEach((p, i) => el("circle", { cx: p[0], cy: p[1], r: 7, fill: i === 3 ? "#d03b3b" : "#3987e5", stroke: "#161a20", "stroke-width": 2.5, class: "pt", "data-i": i }, s));
  const last = SRM[3], sh = last.control / (last.control + last.variant);
  el("text", { x: pts[3][0] - 14, y: pts[3][1] - 18, "text-anchor": "end", fill: "#e9ecf0", "font-size": 19, "font-weight": 650, class: "lab" }, s, `${(sh * 100).toFixed(2)}% · outside the band`);
  $("#ch10", r).appendChild(s);
  $("#miss", r).innerHTML = `<div style="font-size:21px;margin-bottom:12px"><b>Users without a user ID</b> <span class="muted">(through day 4)</span></div>
    <div style="display:flex;align-items:center;gap:14px;font-size:20px"><span style="width:90px" class="t2">Control</span><div class="mb" style="height:22px;background:#3987e5;border-radius:0 4px 4px 0;width:0"></div><b>${fmt(last.missing_id_control)}</b></div>
    <div style="display:flex;align-items:center;gap:14px;font-size:20px;margin-top:8px"><span style="width:90px" class="t2">Variant</span><div style="height:22px;width:3px;background:#d95926"></div><b>${fmt(last.missing_id_variant)}</b></div>`;
  const inc = ev("EXP-10", "incident");
  $("#f10", r).innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${pill("INVALID")}<span class="muted" style="font-size:18px">${T(inc.t).toISOString().slice(11, 16)} UTC, after the daily load</span></div>
    <div class="finding">Split check failed: <b>p = 3.7 × 10⁻⁷</b> (threshold 0.001). <b>No effect is reported.</b><br>Diagnosis: every user without a user ID is in control. This is consistent with users being evaluated before their ID is set.</div>`;
}, (r, lt, clock) => {
  updateMini(r, clock);
  const p = $("#p10", r), L = p.getTotalLength(), prog = ease((lt - 1) / 4);
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - prog);
  r.querySelectorAll(".pt").forEach(c => c.style.opacity = prog >= +c.dataset.i / 3 - .001 ? 1 : 0);
  $(".lab", r).style.opacity = clamp((lt - 5) / .5);
  show($("#miss", r), lt, 5.5); $(".mb", r).style.width = 380 * ease((lt - 6) / 1) + "px";
  show($("#f10", r), lt, 6.5);
  show($("#a10", r), lt, 11); updateAction($("#a10", r), lt, 11.5, 15, 17);
  show($("#t10", r), lt, 20);
}, lt => { const t = T(ev("EXP-10", "incident").t); const m = lt < 15 ? 0 : lt < 17 ? 18 : 19; return new Date(t.getTime() + m * 60000); },
  [[0, 6.5, "Four days in, a simulated onboarding experiment drifts: more and more users land in control."],
   [6.5, 11, "The split check fails, so the agent refuses to report any effect, and finds the cause: every user without an ID is in one arm."],
   [11, 15, "It proposes the safe move: freeze the decision, annotate the experiment, and open a ticket for the app."],
   [15, 20, "A person approves. The change runs in the sandbox, and a receipt is recorded."],
   [20, 25, "The injected truth: the variant does nothing. Without this check, the bug would have shown up as a “result”."]]);

// 3 · false alarm avoided (EXP-12)
const DAILY12 = D.truth["EXP-12"].daily_lesson_starts;
scene("dq", 20, r => {
  r.innerHTML = `<div class="label">3 · A false alarm, avoided · EXP-12 (simulated)</div>${miniBoard("EXP-12")}
    <div style="display:flex;gap:44px">
      <div class="card" style="width:900px;padding:22px 26px">
        <div style="display:flex;align-items:baseline;gap:18px"><div class="h2">Dashboard: lesson starts per day</div>
          <span class="pill s-INVALID" id="dash">! Alert</span></div>
        <div id="dashnum" style="font-size:22px;color:var(--text2);margin:6px 0 4px"></div><div id="ch12"></div></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:18px">
        <div class="card" id="f12"></div>
        <div class="card" id="g12" style="border-color:#1f6b1f"></div>
      </div></div>`;
  const W = 848, H = 420, s = svg(W, H), x0 = 80, y0 = 20, y1 = H - 50, n = 8, bw = 64, gap = (W - x0 - 20 - n * bw) / (n - 1);
  const Y = v => y1 - v / 60000 * (y1 - y0);
  for (const v of [0, 20000, 40000, 60000]) { el("line", { x1: x0, x2: W - 20, y1: Y(v), y2: Y(v), stroke: "#262c35" }, s); el("text", { x: x0 - 12, y: Y(v) + 6, "text-anchor": "end", fill: "#7f8996", "font-size": 17 }, s, v ? fmt(v / 1000) + "k" : "0"); }
  const defs = el("defs", {}, s), pat = el("pattern", { id: "hatch", width: 10, height: 10, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
  el("rect", { width: 10, height: 10, fill: "rgba(57,135,229,.18)" }, pat); el("line", { x1: 0, y1: 0, x2: 0, y2: 10, stroke: "#3987e5", "stroke-width": 3 }, pat);
  for (let i = 0; i < n; i++) {
    const v = DAILY12[i + 1], x = x0 + i * (bw + gap), today = i === n - 1;
    if (!today) el("path", { d: `M${x},${y1} V${Y(v) + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y1} Z`, fill: "#3987e5" }, s);
    el("text", { x: x + bw / 2, y: y1 + 32, "text-anchor": "middle", fill: today ? "#e9ecf0" : "#7f8996", "font-size": 17, "font-weight": today ? 650 : 400 }, s, today ? "Today" : `${i + 2} Nov`);
  }
  const xt = x0 + (n - 1) * (bw + gap);
  el("rect", { x: xt, width: bw, y: Y(D.dq.partial_value), height: y1 - Y(D.dq.partial_value), fill: "url(#hatch)", id: "part" }, s);
  el("rect", { x: xt, width: bw, y: Y(D.dq.next_morning_value), height: y1 - Y(D.dq.next_morning_value), fill: "#3987e5", rx: 4, id: "full", opacity: 0 }, s);
  el("line", { x1: x0, x2: W - 20, y1: Y(D.dq.trailing_mean), y2: Y(D.dq.trailing_mean), stroke: "#e9ecf0", "stroke-dasharray": "5 6", "stroke-width": 1.5, opacity: .6 }, s);
  el("text", { x: W - 22, y: Y(D.dq.trailing_mean) - 10, "text-anchor": "end", fill: "#b1b9c4", "font-size": 16 }, s, "7-day mean");
  $("#ch12", r).appendChild(s);
  const drop = D.dq.partial_value / D.dq.trailing_mean - 1, fin = D.dq.next_morning_value / D.dq.trailing_mean - 1;
  r.dataset.drop = drop; r.dataset.fin = fin;
  $("#f12", r).innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${pill("WAITING")}<span class="muted" style="font-size:18px">14:15 UTC, after a scheduled reload</span></div>
    <div class="finding">Data check: <b>only ${Math.round(D.dq.completeness * 100)}% of today has loaded</b>. Today's exposures arrive with the next daily load at 03:50 UTC.<br><b>Verdict: incomplete data, not a change. No action.</b> Re-check after the load.</div>`;
  $("#g12", r).innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${pill("HEALTHY")}<span class="muted" style="font-size:18px">next morning, 04:00 UTC</span></div>
    <div class="finding">Complete data: <b>${fmt(D.dq.next_morning_value)}</b> lesson starts, <b>${sgn(fin * 100, 1)}%</b> against the 7-day mean. Nothing to do.</div>`;
}, (r, lt, clock) => {
  updateMini(r, clock);
  const drop = +r.dataset.drop, fin = +r.dataset.fin, next = lt >= 12;
  $("#dashnum", r).innerHTML = next ? `Yesterday, complete: <b style="color:var(--text)">${fmt(D.dq.next_morning_value)}</b> · ${sgn(fin * 100, 1)}% vs 7-day mean`
    : `Today so far: <b style="color:var(--text)">${fmt(D.dq.partial_value)}</b> · <b style="color:#ff7b7b">${sgn(drop * 100, 0)}%</b> vs 7-day mean`;
  $("#dash", r).style.opacity = next ? 0 : 1;
  $("#full", r).setAttribute("opacity", clamp((lt - 12) / .6)); $("#part", r).setAttribute("opacity", 1 - clamp((lt - 12) / .6));
  show($("#f12", r), lt, 3.5); show($("#g12", r), lt, 13);
}, lt => { const t = T(ev("EXP-12", "incident").t); return lt < 12 ? t : T(ev("EXP-12", "resolution").t); },
  [[0, 3.5, "Day nine, mid-afternoon: a dashboard shows lesson starts down 44% today."],
   [3.5, 12, "The agent checks the data first: only 57% of the day has loaded. Today's data arrives with the next nightly load, so it waits."],
   [12, 20, "Next morning the complete number is normal. No one was paged, and nothing was changed."]]);

// 4 · real harm (EXP-11)
const LW = D.monitor.log_wealth, ALARM = D.events.find(e => e.experiment === "EXP-11" && e.kind === "incident");
const AD = LW.findIndex(x => x >= D.monitor.threshold) + 1;
scene("harm", 35, r => {
  const eff = ev("EXP-11", "diagnosis").detail.match(/([+-−]?\d\.\d+) per user \[([+-−]?\d\.\d+), ([+-−]?\d\.\d+)\]/);
  const e = eff.slice(1).map(Number), x = A11.proposal.expected;
  r.innerHTML = `<div class="label">4 · Real harm · EXP-11 (simulated)</div>${miniBoard("EXP-11")}
    <div style="display:flex;gap:44px">
      <div style="width:900px">
        <div class="card" style="padding:22px 26px"><div class="h2">Guardrail: trial starts, variant B vs control</div>
          <div class="muted" style="font-size:18px;margin:4px 0 6px">Evidence of a difference, updated after each nightly load. Crossing the line keeps false alarms under 1 in 20 for the whole run.</div>
          <div id="ch11"></div></div>
        <div class="truth" id="t11" style="margin-top:18px"><div class="tl">Injected truth</div>
          Variant B lowers trial starts by <b>5%</b>: <b>${fmt(D.truth["EXP-11"].trial_starts_lost_per_day_while_live)}</b> lost per day, which is inside the stated range.
          <div id="spread" style="margin-top:10px"></div></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:18px">
        <div class="card" id="f11" style="border-color:#7a2626">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${pill("ALARM")}<span class="muted" style="font-size:18px">day ${AD}, ${T(ALARM.t).toISOString().slice(11, 16)} UTC</span></div>
          <div class="finding">Trial starts are <b>down</b> in variant B. Effect re-derived from the group summaries:<br>
          <b>${sgn(e[0] * 100, 2)}</b> trial starts per 100 users, range <b>${sgn(e[1] * 100, 2)} to ${sgn(e[2] * 100, 2)}</b> <span class="muted">(90%; valid if the split is healthy, which it is)</span></div></div>
        <div id="a11">${actionCard(A11, "Stop variant B (set its rollout to 0%)",
          [`Expected: <b style="color:var(--text)">+${fmt(x.mean)}</b> trial starts per day, range +${fmt(x.lower)} to +${fmt(x.upper)}`, "Control keeps running; nothing else changes", "Reversible: rollout can be restored"])}</div>
      </div></div>`;
  const W = 848, H = 330, s = svg(W, H), x0 = 64, x1 = W - 30, y0 = 18, y1 = H - 48, N = AD;
  const X = d => x0 + (d - 1) / (N - 1) * (x1 - x0), lo = -.5, hi = 3.6, Y = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
  for (const v of [0, 1, 2, 3]) el("line", { x1: x0, x2: x1, y1: Y(v), y2: Y(v), stroke: "#262c35" }, s);
  el("line", { x1: x0, x2: x1, y1: Y(D.monitor.threshold), y2: Y(D.monitor.threshold), stroke: "#d03b3b", "stroke-dasharray": "8 6", "stroke-width": 2 }, s);
  el("text", { x: x0 + 6, y: Y(D.monitor.threshold) - 10, fill: "#ff9a9a", "font-size": 17, "font-weight": 600 }, s, "Alarm line");
  for (let d = 1; d <= N; d++) el("text", { x: X(d), y: y1 + 32, "text-anchor": "middle", fill: "#7f8996", "font-size": 17 }, s, d === 1 ? "Day 1" : d);
  el("text", { x: x0 - 12, y: Y(0) + 6, "text-anchor": "end", fill: "#7f8996", "font-size": 17 }, s, "none");
  const pts = LW.slice(0, N).map((v, i) => [X(i + 1), Y(v)]);
  el("path", { d: "M" + pts.map(p => p.join(",")).join(" L"), fill: "none", stroke: "#3987e5", "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round", id: "p11" }, s);
  pts.forEach((p, i) => el("circle", { cx: p[0], cy: p[1], r: i === N - 1 ? 8 : 5, fill: i === N - 1 ? "#d03b3b" : "#3987e5", stroke: "#161a20", "stroke-width": 2.5, class: "pt", "data-i": i }, s));
  $("#ch11", r).appendChild(s);
  const days = D.spread.alarm_days.filter(Boolean), mx = Math.max(...days), sp = svg(800, 92), cnt = {};
  for (let d = 4; d <= mx; d++) el("text", { x: 20 + (d - 4) * (760 / (mx - 4)), y: 88, "text-anchor": "middle", fill: "#7f8996", "font-size": 14 }, sp, d);
  days.forEach(d => { cnt[d] = (cnt[d] || 0) + 1; el("circle", { cx: 20 + (d - 4) * (760 / (mx - 4)), cy: 66 - (cnt[d] - 1) * 6.5, r: 3, fill: d === AD && cnt[d] === 1 ? "#e9ecf0" : "#3987e5" }, sp); });
  $("#spread", r).innerHTML = `<span style="font-size:18px">Is day ${AD} typical? The same monitor on ${D.spread.seeds} simulated runs alarmed on day ${Math.min(...days)}–${mx} (median ${D.spread.median}):</span>`;
  $("#spread", r).appendChild(sp);
}, (r, lt, clock) => {
  updateMini(r, clock);
  const p = $("#p11", r), L = p.getTotalLength(), prog = ease((lt - .8) / 7);
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - prog);
  r.querySelectorAll(".pt").forEach(c => c.style.opacity = prog >= +c.dataset.i / (AD - 1) - .001 ? 1 : 0);
  show($("#f11", r), lt, 9); show($("#a11", r), lt, 15); updateAction($("#a11", r), lt, 15.5, 20.5, 22.5);
  show($("#t11", r), lt, 26.5);
}, lt => { const t = T(ALARM.t), m = lt < 20.5 ? 0 : lt < 22.5 ? 25 : 26; return new Date(t.getTime() + m * 60000); },
  [[0, 8.5, "Meanwhile, a guardrail check runs on every experiment after each nightly load. The evidence builds day by day, and checking daily does not inflate false alarms."],
   [8.5, 15, `On day ${AD} the evidence crosses the line: variant B is costing trial starts. The agent re-derives the size of the effect, with its range.`],
   [15, 20.5, "It proposes stopping the variant and states the expected gain: about 90 trial starts a day."],
   [20.5, 26.5, "A person approves, and the change runs in the sandbox. Only control keeps running."],
   [26.5, 35, `The injected harm was 5%, or 100 trial starts a day, inside the stated range. Day ${AD} is a typical alarm day for an effect this size.`]]);

// 5 · ship request
const SHIP = D.backdrop.find(b => b.id === D.ship.experiment);
scene("ship", 15, r => {
  const [lo, hi] = SHIP.interval;
  r.innerHTML = `<div class="label">5 · “Can we ship it?” · ${SHIP.id} (real, anonymized)</div>
    <div style="display:flex;gap:44px;margin-top:70px">
      <div style="width:760px">
        <div class="card" id="q" style="font-size:36px;line-height:1.4;border-radius:18px 18px 18px 4px">“Can we ship ${SHIP.id} to everyone?”<div class="muted" style="font-size:18px;margin-top:8px">${SHIP.area} · ${SHIP.metric}</div></div>
        <div class="card" id="ref" style="margin-top:22px;border-color:#7a2626">
          <div style="font-size:18px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text2);margin-bottom:10px">Attempt outside the sandbox</div>
          <div class="finding"><span class="ic no" style="display:inline-flex;width:30px;height:30px;margin-right:10px">✕</span><b>Refused.</b> The executor only acts on the sandbox it belongs to; a production target is rejected before anything happens.</div></div>
      </div>
      <div style="flex:1;font-size:24px" class="act" id="pol">
        <div class="hd">Policy decision</div>
        <div class="row" style="opacity:1;border-top:0"><span class="ic ok">✓</span><span><b>Report the effect:</b> allowed. ${sgn(SHIP.effect * 100, 1)} percentage points, range ${sgn(lo * 100, 1)} to ${sgn(hi * 100, 1)}. The range includes zero.</span></div>
        <div class="row" style="opacity:1"><span class="ic no">✕</span><span><b>Change production:</b> denied. The engine has no write access to production.</span></div>
        <div class="row" style="opacity:1"><span class="ic info">→</span><span><b>Proposal</b> sent to the experiment owner for review. Nothing changed.</span></div>
      </div></div>`;
}, (r, lt) => { show($("#q", r), lt, .3); show($("#pol", r), lt, 3); show($("#ref", r), lt, 9); },
  () => T(D.events.find(e => e.kind === "request").t),
  [[0, 3, "Later, someone asks the agent to ship a real experiment to everyone."],
   [3, 9, "It reports the effect and its range, which includes zero. A change to production is denied: proposals go to a person."],
   [9, 15, "Even an approved action cannot leave the sandbox: a production target is refused."]]);

// 6 · close
scene("close", 16, r => {
  const n = D.events, inc = n.filter(e => e.kind === "incident").length;
  r.innerHTML = `<div class="label">The replay, 31 Oct – 21 Nov</div>
    <div class="card" style="margin-top:16px;padding:22px 26px" id="tl"></div>
    <div style="display:flex;gap:18px;margin-top:22px" id="stats">
      ${[[D.wakeups, "wake-ups after data loads"], [inc, "incidents handled"], [D.actions.length, "actions, each approved by a person"], [1, "false alarm avoided"], [0, "production writes"]]
        .map(([v, l]) => `<div class="card" style="flex:1;padding:20px 24px"><div class="big">${v}</div><div class="t2" style="font-size:20px">${l}</div></div>`).join("")}</div>
    <div id="tag" style="font-size:38px;font-weight:600;margin-top:34px;text-align:center">It watches every load, tells data problems from real changes, and proposes. <span style="color:var(--text2)">A person decides.</span></div>
    <div id="foot" class="muted" style="font-size:17px;text-align:center;margin-top:16px">EXP-01–09: real, cached platform data, anonymized. EXP-10–12: simulated, injected truth shown. Approvals in this replay are scripted. Engine checks ran in ${Math.round(D.timings.median_ms)} ms (median).</div>`;
  const W = 1792, H = 290, s = svg(W, H), x0 = 190, x1 = W - 30, t0 = Date.UTC(2026, 9, 31), t1 = Date.UTC(2026, 10, 23);
  const X = t => x0 + (T(t).getTime() - t0) / (t1 - t0) * (x1 - x0);
  const lanes = [["EXP-10", "Broken split"], ["EXP-12", "False alarm"], ["EXP-11", "Real harm"], [SHIP.id, "Ship request"]];
  for (let d = 0; d <= 21; d += 3) { const x = x0 + d / 23 * (x1 - x0); el("line", { x1: x, x2: x, y1: 10, y2: H - 34, stroke: "#262c35" }, s); el("text", { x, y: H - 8, "text-anchor": "middle", fill: "#7f8996", "font-size": 16 }, s, new Date(t0 + d * 864e5).getUTCDate() + " " + MON[new Date(t0 + d * 864e5).getUTCMonth()]); }
  const MK = { incident: ["●", "#ff7b7b"], request: ["●", "#7fb2f0"], proposal: ["◆", "#7fb2f0"], execution: ["✓", "#5fd35f"], resolution: ["○", "#5fd35f"], policy: ["✕", "#ff7b7b"] };
  lanes.forEach(([id, name], i) => {
    const y = 34 + i * 60;
    el("text", { x: 0, y: y + 6, fill: "#e9ecf0", "font-size": 19, "font-weight": 650 }, s, id); el("text", { x: 82, y: y + 6, fill: "#7f8996", "font-size": 16 }, s, name);
    const es = n.filter(e => e.experiment === id && MK[e.kind]);
    if (es.length > 1) el("line", { x1: X(es[0].t), x2: X(es.at(-1).t) + 30, y1: y, y2: y, stroke: "#3e4652", "stroke-width": 3 }, s);
    es.forEach((e, k) => { const [g, c] = MK[e.kind]; el("text", { x: X(e.t) + k * 15, y: y + 7, "text-anchor": "middle", fill: c, "font-size": 21, "font-weight": 800, class: "mk", "data-t": T(e.t).getTime() }, s, g); });
  });
  $("#tl", r).innerHTML = `<div class="t2" style="font-size:18px;margin-bottom:8px"><span style="color:#ff7b7b">●</span> incident &nbsp; <span style="color:#7fb2f0">◆</span> proposal &nbsp; <span style="color:#5fd35f">✓</span> executed in the sandbox &nbsp; <span style="color:#5fd35f">○</span> resolved, no action &nbsp; <span style="color:#ff7b7b">✕</span> production change denied</div>`;
  $("#tl", r).appendChild(s);
}, (r, lt) => {
  const cut = Date.UTC(2026, 9, 31) + ease((lt - .3) / 3.5) * 23 * 864e5;
  r.querySelectorAll(".mk").forEach(m => m.style.opacity = +m.dataset.t <= cut ? 1 : 0);
  r.querySelectorAll("#stats .card").forEach((c, i) => show(c, lt, 3.8 + i * .25, .5, 8));
  show($("#tag", r), lt, 7.5); show($("#foot", r), lt, 9);
}, () => new Date(Date.UTC(2026, 10, 21, 23, 59)),
  [[0, 7.5, "Three weeks of replay: every load checked, three incidents handled, one false alarm avoided."],
   [7.5, 16, "It pauses what is broken, suggests a fix with a best guess of how much it helps, and acts only after a person approves, and only in the sandbox."]]);

const TOTAL = SCENES.at(-1).start + SCENES.at(-1).dur;
window.TOTAL = TOTAL;
const FADE = .5;
window.render = function (t) {
  let capText = "";
  for (const s of SCENES) {
    const lt = t - s.start;
    const vis = lt >= -FADE && lt <= s.dur;
    if (!vis) { s.root.style.opacity = 0; s.root.style.display = "none"; continue; }
    s.root.style.display = "block";
    s.root.style.opacity = Math.min(clamp((lt + FADE) / FADE), clamp((s.dur - lt) / FADE + (s === SCENES.at(-1) ? 1 : 0)));
    const clock = s.clock(Math.max(0, lt));
    s.update(s.root, Math.max(0, lt), clock);
    if (lt >= 0 && lt < s.dur) {
      $("#clock").innerHTML = clock ? clockStr(clock) : "Replay · 31 Oct – 21 Nov 2026";
      for (const [a, b, txt] of s.captions) if (lt >= a && lt < b) capText = txt;
    }
  }
  const c = $("#captext"); if (c.textContent !== capText) c.textContent = capText;
};
const q = new URLSearchParams(location.search);
if (!q.has("record")) {                                   // live preview: play in real time; ?t=SECONDS freezes a frame
  if (q.has("t")) window.render(+q.get("t"));
  else { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
}
</script>
</body>
</html>
