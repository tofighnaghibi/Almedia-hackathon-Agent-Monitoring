# Storefront mode for the emulator (M4/M5). Overrides only; upstream 3.1.0 untouched.
#   flagd reads a flag file owned by the flag adapter; the collector applies the hidden-fault redaction
#   layer and writes spans/logs to files for the telemetry adapter.
# Use with: OTEL_COLLECTOR_CONFIG_EXTRAS=<repo>/deploy/m0/otelcol-redact.yml DEMO_VERSION=3.1.0
services:
  otel-collector:
    volumes:
      - ${HOME}/data/mkt/astronomy/live:/m0out
  flagd:
    volumes: !override
      - ${HOME}/data/mkt/astronomy/flags:/etc/flagd
